Workshop: GitHub Actions CI/CD
Template

This document provides the starter template for the Continuous Integration (CI) pipeline used in
Module 4 of the workshop. 
This pipeline acts as the "Assembly Line," automatically testing the
AI agent every time code is committed to the repository.

Instructions for Attendees

1. In the root of your project directory, create a new folder named .github.

2. Inside the .github folder, create another folder named workflows.

3. Create a file named ci.yml inside the workflows folder.

4. Copy the YAML configuration below and paste it into your ci.yml file.

GitHub Actions Configuration (ci.yml)

Note: This workflow is configured to run tests using Python 3.11, matching the Docker
development environment used in Module 1.

name: Agent CI Pipeline
on:
push:
branches: [ "main" ]
pull_request:
branches: [ "main" ]
jobs:
test-agent:
runs-on: ubuntu-latest
steps:
- name: Checkout Repository
uses: actions/checkout@v4
- name: Set up Python 3.11
uses: actions/setup-python@v5
with:
python-version: "3.11"
- name: Install Dependencies
run: |
python -m pip install --upgrade pip
if [ -f requirements.txt ]; then pip install -r

requirements.txt; fi

pip install pytest
- name: Run Unit Tests
run: |
pytest

Understanding the Assembly Line
 - Triggers (on): The pipeline starts automatically whenever code is pushed to the main
branch.
 - Environment (runs-on): It provisions a fresh Ubuntu runner in the cloud for testing.
 - Steps: It pulls the repository code, installs Python 3.11, installs any required
dependencies (like API clients for the agent), and finally executes the tests to ensure the
agent's logic remains intact.